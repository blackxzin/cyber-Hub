# CyberHub AI — infra de desenvolvimento
# Uso: docker compose up -d   |   logs: docker compose logs -f
services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberhub_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cyberhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cyberhub-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-cyberhub_redis_dev} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cyberhub_redis_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: cyberhub-n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-cyberhub_n8n_dev}
      N8N_HOST: localhost
      N8N_PORT: 5678
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168 # 7 dias
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/opt/workflows:ro # workflows versionados, import manual
    depends_on:
      postgres:
        condition: service_healthy

  # Hermes via Ollama — descomente quando o modelo for usado localmente
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: cyberhub-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  postgres_data:
  redis_data:
  n8n_data:
